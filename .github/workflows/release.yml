name: Release

# Triggered by pushing a version tag (e.g. git push origin v0.9.6).
# Builds the Docker image, pushes it to GHCR with semver tags, attests
# build provenance for supply-chain verification, and creates a GitHub
# Release if one does not already exist for the tag.
#
# workflow_dispatch allows manual triggering from the Actions tab or CLI:
#   gh workflow run release.yml --ref v0.9.6
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write    # create GitHub Release
  packages: write    # push to ghcr.io
  attestations: write
  id-token: write    # required for attestation signing

jobs:
  publish:
    name: Build & Publish Docker image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ccfleet
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ccfleet
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — skipping creation."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

          # Append Docker pull instructions to the release body.
          EXISTING=$(gh release view "$TAG" --json body -q '.body')
          DOCKER_NOTES=$(printf '\n## Docker image\n\n```bash\ndocker pull ghcr.io/${{ github.repository_owner }}/ccfleet:%s\n# or pin to this exact build:\ndocker pull ghcr.io/${{ github.repository_owner }}/ccfleet@%s\n```' "$TAG" "$DIGEST")
          gh release edit "$TAG" --notes "${EXISTING}${DOCKER_NOTES}"
